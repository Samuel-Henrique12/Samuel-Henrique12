<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Samuel Henrique</title>
  <desc id="descricao">Desenvolvedor Fullstack especializado em Java e Spring Boot</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="cantos">
      <rect width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cantos)">
    <rect width="1200" height="280" fill="url(#fundo)"/>
    <rect width="1200" height="280" fill="url(#grade)"/>
    <circle cx="1010" cy="140" r="230" fill="url(#brilho)"/>
    <rect x="0" y="0" width="6" height="280" fill="url(#acento)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="98" fill="#A3A3A3" font-size="20" font-weight="500" letter-spacing="4">OLÁ, EU SOU</text>
    <text x="70" y="160" fill="#FAFAFA" font-size="60" font-weight="700">Samuel <tspan fill="url(#acento)">Henrique</tspan></text>
    <text x="72" y="204" fill="#D4D4D4" font-size="24" font-weight="500">Desenvolvedor Fullstack · Java &amp; Spring Boot</text>
  </g>

  <g font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="20" text-anchor="middle">
    <rect x="860" y="96" width="300" height="88" rx="12" fill="#0A0A0A" fill-opacity="0.6" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="1010" y="134" fill="#F97316">@RestController</text>
    <text x="1010" y="164" fill="#A3A3A3">class SamuelHenrique</text>
  </g>
</svg>
